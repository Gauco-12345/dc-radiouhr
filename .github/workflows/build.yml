name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|ERROR:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DC-Radiouhr-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: APK für festen Download-Link vorbereiten
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk DC-Radiouhr.apk
      - name: Download-Link aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          name: DC Radiouhr – aktuelle Version
          body: "Immer die neueste Version: DC-Radiouhr.apk herunterladen und installieren."
          files: DC-Radiouhr.apk
          overwrite_files: true
          make_latest: true

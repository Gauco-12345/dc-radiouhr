name: Starttest im Emulator

on:
  workflow_dispatch:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK bauen
        run: gradle assembleDebug --no-daemon -q
      - name: Im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n de.datacreate.radiouhr/.MainActivity
            sleep 20
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 10
            adb shell am start -n de.datacreate.radiouhr/.SettingsActivity || true
            sleep 5
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d -s AndroidRuntime:E Radiouhr:E > rt.txt || true
            cat crash.txt rt.txt | grep -v "^-----" | head -60 | sed 's/^/::warning::/' || true
            echo "::notice::Starttest fertig"
